plugins {
    id 'java-platform'
    id 'maven-publish'
}

group = 'io.github.tcq1007'
version = springbootDependenciesVersion

javaPlatform {
    allowDependencies()
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    api platform("com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}")
    api platform("com.querydsl:querydsl-bom:${querydslVersion}")

    constraints {
        api "org.mapstruct:mapstruct:${mapstructVersion}"
        api "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        api "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
        api "com.baizhukui:knife4j-openapi3-boot4-spring-boot-starter:${knife4jVersion}"
        api "com.alibaba.cloud:spring-alibaba-nacos-config:${alibabaNacosConfigVersion}"
        api "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        api "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
        api "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
        api "org.apache.commons:commons-configuration2:${commonsConfiguration2Version}"
        api "commons-beanutils:commons-beanutils:${commonsBeanutilsVersion}"
        api "org.apache.commons:commons-pool2:${commonsPool2Version}"
        api "org.casbin:casbin-spring-boot-starter:${casbinSpringBootStarterVersion}"
        api "org.casbin:jcasbin-redis-watcher:${jcasbinRedisWatcherVersion}"
        api "com.google.guava:guava:${guavaVersion}"
        api "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
        api "io.github.tcq1007:springboot-utils:${springbootUtilsVersion}"
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'springboot-dependencies'
            from components.javaPlatform
            pom {
                name = 'springboot-dependencies'
                description = 'Shared Maven BOM for io.github.tcq1007 Spring Boot projects'
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/TCQ1007/springboot-dependencies')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

tasks.register('generateVersionHtml') {
    group = 'documentation'
    description = 'Generate versions.html from this java-platform BOM declarations'

    def outputFile = layout.projectDirectory.file('versions.html')
    outputs.file(outputFile)

    inputs.property('platformVersion', provider { project.version.toString() })
    inputs.files(file('gradle.properties'))

    doLast {
        def platformRows = new TreeMap<String, String>()
        def constraintRows = new TreeMap<String, String>()

        // java-platform api is not resolvable; read declared platforms + constraints
        def api = configurations.getByName('api')

        api.dependencies.each { dep ->
            if (dep.group == null || dep.name == null) {
                return
            }
            def key = "${dep.group}:${dep.name}".toString()
            platformRows[key] = dep.version ?: 'unspecified'
        }

        api.dependencyConstraints.each { constraint ->
            if (constraint.group == null || constraint.name == null) {
                return
            }
            def key = "${constraint.group}:${constraint.name}".toString()
            def ver = constraint.version
            if (ver == null && constraint.versionConstraint != null) {
                ver = constraint.versionConstraint.requiredVersion ?: constraint.versionConstraint.preferredVersion
            }
            constraintRows[key] = ver ?: 'unspecified'
        }

        def toTableRows = { Map<String, String> rows ->
            rows.collect { k, v ->
                "<tr><td><code>${k}</code></td><td><code>${v}</code></td></tr>"
            }.join('\n')
        }

        def total = platformRows.size() + constraintRows.size()
        outputFile.getAsFile().setText("""<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOM dependency versions</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; }
  h2 { margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
  th { background: #f5f5f5; position: sticky; top: 0; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
  tr:hover { background: #fafafa; }
</style>
</head>
<body>
<h1>BOM dependency versions</h1>
<p>Platform <code>${project.version}</code> - ${total} entries (${platformRows.size()} imported BOMs, ${constraintRows.size()} constraints).</p>

<h2>Imported BOMs</h2>
<p>Upstream platforms re-exported by this BOM.</p>
<table>
<thead><tr><th>Coordinates (group:artifact)</th><th>Version</th></tr></thead>
<tbody>
${toTableRows(platformRows)}
</tbody>
</table>

<h2>Direct constraints</h2>
<p>Third-party versions locked directly by this BOM.</p>
<table>
<thead><tr><th>Coordinates (group:artifact)</th><th>Version</th></tr></thead>
<tbody>
${toTableRows(constraintRows)}
</tbody>
</table>
</body>
</html>""", 'UTF-8')

        logger.lifecycle("Wrote ${platformRows.size()} BOM imports and ${constraintRows.size()} constraints to ${outputFile.getAsFile()}")
    }
}


